<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexora Systems - Login</title>
  
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <link rel="stylesheet" href="../../global.css">
</head>
<body class="bg-[#F8F9FA] flex h-screen items-center justify-center font-sans">

  <!-- Background decorations -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-40 -right-40 w-96 h-96 bg-blue-100 rounded-full blur-3xl opacity-50"></div>
    <div class="absolute -bottom-40 -left-40 w-96 h-96 bg-indigo-100 rounded-full blur-3xl opacity-50"></div>
  </div>

  <div class="w-full max-w-md bg-white rounded-3xl border border-slate-100 shadow-2xl overflow-hidden relative z-10 flex flex-col">
    
    <!-- Header Area -->
    <div class="bg-[#38BDF8] px-8 py-10 flex flex-col items-center justify-center relative overflow-hidden">
      <!-- subtle grid overlay -->
      <div class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMCIgaGVpZ2h0PSIyMCI+PGNpcmNsZSBjeD0iMSIgY3k9IjEiIHI9IjEiIGZpbGw9InJnYmEoMjU1LDI1NSwyNTUsMC4wNykiLz48L3N2Zz4=')]"></div>
      
      <div class="w-16 h-16 rounded-2xl bg-[#4ADE80] flex items-center justify-center shadow-[0_0_30px_rgba(29,78,216,0.6)] mb-4 relative z-10">
        <span class="text-[#38BDF8] font-light uppercase tracking-widest text-xl font-light tracking-widest select-none">V</span>
      </div>
      <h1 class="text-white font-light uppercase tracking-widest text-2xl tracking-wide relative z-10">Nexora Systems</h1>
      <p class="text-[#38BDF8] text-sm mt-1 font-medium relative z-10">Intelligent Procurement Platform</p>
    </div>

    <!-- Login Form -->
    <div class="p-8">
      <h2 class="text-lg font-light uppercase tracking-widest text-[#38BDF8] mb-6 text-center">Sign in to your account</h2>
      
      <form id="loginForm" class="space-y-5">
        <div>
          <label class="block text-xs font-light uppercase tracking-widest text-[#38BDF8] uppercase tracking-wide mb-2">Email Address</label>
          <div class="relative">
            <i data-lucide="mail" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-[#38BDF8]"></i>
            <input type="email" id="txtEmail" value="admin@nexora.com" class="w-full border border-slate-200 rounded-xl pl-10 pr-4 py-3 text-sm bg-[#F8F9FA] outline-none focus:border-vb-blue focus:bg-white focus:ring-4 focus:ring-blue-50 font-medium transition-all" required>
          </div>
        </div>

        <div>
          <div class="flex justify-between items-center mb-2">
            <label class="block text-xs font-light uppercase tracking-widest text-[#38BDF8] uppercase tracking-wide">Password</label>
            <a href="#" class="text-xs font-light uppercase tracking-widest text-[#38BDF8] hover:text-blue-800 transition-colors">Forgot?</a>
          </div>
          <div class="relative">
            <i data-lucide="lock" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-[#38BDF8]"></i>
            <input type="password" id="txtPassword" value="password123" class="w-full border border-slate-200 rounded-xl pl-10 pr-4 py-3 text-sm bg-[#F8F9FA] outline-none focus:border-vb-blue focus:bg-white focus:ring-4 focus:ring-blue-50 font-medium transition-all" required>
          </div>
        </div>

        <button type="submit" id="btnLogin" class="w-full bg-[#4ADE80] hover:bg-[#22c55e] text-white font-light uppercase tracking-widest py-3 px-4 rounded-xl shadow-lg shadow-blue-600/30 transition-all flex items-center justify-center gap-2 mt-2">
          <span>Secure Sign In</span>
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
      </form>
      
      <p id="errorMsg" class="text-red-500 text-xs font-light uppercase tracking-widest text-center mt-4 hidden">Invalid credentials. Please try again.</p>

      <div class="mt-8 text-center border-t border-slate-100 pt-6 space-y-4">
        <a href="../Dashboard/dashboard_layout.html" class="block w-full bg-[#F8F9FA] hover:bg-slate-200 text-slate-700 font-light uppercase tracking-widest py-3 px-4 rounded-xl transition-all flex items-center justify-center gap-2">
          <i data-lucide="eye" class="w-4 h-4"></i> Continue as Guest
        </a>
        <p class="text-xs text-[#38BDF8] font-medium">Don't have an account? <a href="../Register/register_layout.html" class="text-[#38BDF8] hover:underline">Register here</a></p>
      </div>
    </div>

  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="../supabase_client.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      
      const form = document.getElementById('loginForm');
      const btnLogin = document.getElementById('btnLogin');
      const errorMsg = document.getElementById('errorMsg');
      const emailInput = document.getElementById('txtEmail');
      const passInput = document.getElementById('txtPassword');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        btnLogin.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> Authenticating...';
        btnLogin.classList.add('opacity-80', 'cursor-not-allowed');
        lucide.createIcons();
        errorMsg.classList.add('hidden');

        try {
          if(!window.supabaseClient) throw new Error('Supabase not loaded');
          const { data, error } = await window.supabaseClient.auth.signInWithPassword({
            email: emailInput.value,
            password: passInput.value
          });

          if(error) throw error;
          
          window.location.href = '../Dashboard/dashboard_layout.html';
        } catch (err) {
          errorMsg.textContent = err.message || 'Invalid credentials. Please try again.';
          errorMsg.classList.remove('hidden');
          btnLogin.innerHTML = '<span>Secure Sign In</span><i data-lucide="arrow-right" class="w-4 h-4"></i>';
          btnLogin.classList.remove('opacity-80', 'cursor-not-allowed');
          lucide.createIcons();
        }
      });
    });
  </script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const pBtn = document.getElementById('profileDropdownBtn');
      const pMenu = document.getElementById('profileDropdownMenu');
      const bLogout = document.getElementById('btnLogout');
      
      if(pBtn && pMenu) {
        // Remove existing listeners if any by cloning
        const newBtn = pBtn.cloneNode(true);
        pBtn.parentNode.replaceChild(newBtn, pBtn);
        
        newBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          pMenu.classList.toggle('hidden');
        });
        
        document.addEventListener('click', (e) => {
          if(!pMenu.contains(e.target) && !newBtn.contains(e.target)) {
            pMenu.classList.add('hidden');
          }
        });
      }
      
      if(bLogout) {
        const newLogout = bLogout.cloneNode(true);
        bLogout.parentNode.replaceChild(newLogout, bLogout);
        
        newLogout.addEventListener('click', async () => {
          if(window.supabaseClient && window.supabaseClient.auth) {
            await window.supabaseClient.auth.signOut();
          }
          window.location.href = '../Login/login_layout.html';
        });
      }
    });
  </script>

</body>
</html>
