<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VendorBridge - Authentication Portal</title>
    <!-- Meta Descriptions for SEO -->
    <meta name="description" content="Access VendorBridge. Enter your username and password to log into the centralized procurement and ERP platform.">
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <main class="card-container">
        
        <!-- ==========================================
             1. LOGIN CARD
             ========================================== -->
        <article class="auth-card" id="login-card">
            
            <!-- User Profile Picture Container (Click to change) -->
            <div class="profile-pic-container" id="profile-pic" title="Click to change profile picture" style="cursor: pointer;">
                <!-- User Profile Image -->
                <img id="avatar-img" src="../../../assets/user_avatar_arjun.png" alt="User Profile Picture">
                <div class="avatar-overlay">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                        <circle cx="12" cy="13" r="4"/>
                    </svg>
                </div>
            </div>
            <!-- Hidden File Input -->
            <input type="file" id="avatar-upload" accept="image/*" class="hidden">

            <!-- Header Titles -->
            <h1 class="brand-name">VendorBridge</h1>
            <p class="brand-subtitle">Enter your credentials to access your procurement dashboard</p>

            <!-- Inline Alert Box -->
            <div class="alert-box" id="login-alert" role="alert" aria-live="assertive">
                <svg class="alert-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path class="alert-icon-path" d=""></path>
                </svg>
                <span class="alert-message"></span>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="auth-form" novalidate>
                <!-- Username / Email Group -->
                <div class="form-group">
                    <label for="username" class="form-label">Username or Email</label>
                    <div class="input-wrapper">
                        <span class="input-icon-left" aria-hidden="true">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                                <circle cx="12" cy="7" r="4" />
                            </svg>
                        </span>
                        <input 
                            type="text" 
                            id="username" 
                            class="form-input" 
                            placeholder="Enter username or email" 
                            autocomplete="username"
                            required
                        >
                    </div>
                </div>

                <!-- Password Group -->
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon-left" aria-hidden="true">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                            </svg>
                        </span>
                        <input 
                            type="password" 
                            id="password" 
                            class="form-input form-input-password" 
                            placeholder="Enter password" 
                            autocomplete="current-password"
                            required
                        >
                        <button type="button" class="password-toggle-btn" id="password-toggle" aria-label="Toggle password visibility">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Forgot Password Utility Link -->
                <div class="form-utilities">
                    <a href="#" class="forgot-link" id="trigger-forgot">Forgot password?</a>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-action" id="login-submit">
                    <span class="spinner" aria-hidden="true"></span>
                    <span class="btn-text">Sign In</span>
                </button>
            </form>

        </article>

        <!-- ==========================================
             2. FORGOT PASSWORD CARD (Hidden by default)
             ========================================== -->
        <article class="auth-card hidden" id="forgot-card">
            
            <!-- Recovery Icon Container -->
            <div class="profile-pic-container" aria-hidden="true">
                <!-- Lock Reset Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25a3 3 0 0 1 3 3m3 0a6 6 0 0 1-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1 1 21.75 8.25Z" />
                </svg>
            </div>

            <!-- Header Titles -->
            <h1 class="brand-name">Forgot Password?</h1>
            <p class="brand-subtitle">Enter your email address and we'll send you recovery instructions</p>

            <!-- Inline Alert Box -->
            <div class="alert-box" id="forgot-alert" role="alert" aria-live="assertive">
                <svg class="alert-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path class="alert-icon-path" d=""></path>
                </svg>
                <span class="alert-message"></span>
            </div>

            <!-- Forgot Password Form -->
            <form id="forgot-form" class="auth-form" novalidate>
                <!-- Registered Email Group -->
                <div class="form-group">
                    <label for="recovery-email" class="form-label">Recovery Email Address</label>
                    <div class="input-wrapper">
                        <span class="input-icon-left" aria-hidden="true">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect width="20" height="16" x="2" y="4" rx="2"/>
                                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                            </svg>
                        </span>
                        <input 
                            type="email" 
                            id="recovery-email" 
                            class="form-input" 
                            placeholder="Enter registered email" 
                            autocomplete="email"
                            required
                        >
                    </div>
                </div>

                <!-- Action Buttons -->
                <button type="submit" class="btn-action" id="recovery-submit">
                    <span class="spinner" aria-hidden="true"></span>
                    <span class="btn-text">Send Recovery Link</span>
                </button>

                <button type="button" class="btn-action btn-secondary" id="trigger-login">
                    Back to Login
                </button>
            </form>

        </article>

    </main>

    <!-- Connect JS file -->
    <script src="login_logic.js"></script>
</body>
</html>
