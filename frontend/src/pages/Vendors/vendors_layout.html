<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexora Systems - Vendors</title>
  
  <!-- CDNs for Tailwind CSS, Lucide Icons -->
  
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Tailwind Configuration to extend colors -->
  
  
  <!-- Custom stylesheet link -->
  <link rel="stylesheet" href="./vendors.css">
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="..\..\global.css">
</head>
<body class="bg-[#F8F9FA] flex h-screen overflow-hidden">

  <!-- ================= SIDEBAR ================= -->
  <aside id="sidebar" class="sidebar-transition w-64 bg-white text-[#38BDF8] flex flex-col justify-between h-full border-r border-slate-200 shrink-0 z-20 relative shadow-[4px_0_24px_rgba(0,0,0,0.02)]">
    <div class="flex flex-col overflow-y-auto grow">
      <div class="p-6 flex items-center gap-3 border-b border-slate-100">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-[#4ADE80] to-blue-700 flex items-center justify-center shadow-lg shadow-blue-500/20 shrink-0">
          <span class="text-white font-light uppercase tracking-widest text-xl select-none">V</span>
        </div>
        <span id="logoText" class="text-[#38BDF8] font-light uppercase tracking-widest text-lg tracking-tight select-none">Nexora Systems</span>
      </div>
      <nav class="p-4 space-y-1 grow">
        <a href="../Dashboard/dashboard_layout.html" class="sidebar-item flex items-center gap-3.5 px-4 py-3 rounded-xl text-sm font-light uppercase tracking-widest text-[#38BDF8] hover:text-[#38BDF8] hover:bg-[#F8F9FA] transition-colors" data-page="Dashboard"><i data-lucide="layout-dashboard" class="w-5 h-5 shrink-0"></i><span class="sidebar-label">Dashboard</span></a>
        <a href="../Vendors/vendors_layout.html" class="sidebar-item flex items-center gap-3.5 px-4 py-3 rounded-xl text-sm font-light uppercase tracking-widest text-[#38BDF8] hover:text-[#38BDF8] hover:bg-[#F8F9FA] transition-colors" data-page="Vendors"><i data-lucide="users" class="w-5 h-5 shrink-0"></i><span class="sidebar-label">Vendors</span></a>
        <a href="../RFQs/rfqs_layout.html" class="sidebar-item flex items-center gap-3.5 px-4 py-3 rounded-xl text-sm font-light uppercase tracking-widest text-[#38BDF8] hover:text-[#38BDF8] hover:bg-[#F8F9FA] transition-colors" data-page="RFQs"><i data-lucide="file-text" class="w-5 h-5 shrink-0"></i><span class="sidebar-label">RFQs</span></a>
        <a href="../Quotations/quotations_layout.html" class="sidebar-item flex items-center gap-3.5 px-4 py-3 rounded-xl text-sm font-light uppercase tracking-widest text-[#38BDF8] hover:text-[#38BDF8] hover:bg-[#F8F9FA] transition-colors" data-page="Quotations"><i data-lucide="message-square-quote" class="w-5 h-5 shrink-0"></i><span class="sidebar-label">Quotations</span></a>
        <a href="../Approval/approval_layout.html" class="sidebar-item flex items-center gap-3.5 px-4 py-3 rounded-xl text-sm font-light uppercase tracking-widest text-[#38BDF8] hover:text-[#38BDF8] hover:bg-[#F8F9FA] transition-colors" data-page="Approval"><i data-lucide="check-square" class="w-5 h-5 shrink-0"></i><span class="sidebar-label">Approvals</span></a>
        <a href="../PO_Invoice/po_invoice_layout.html" class="sidebar-item flex items-center gap-3.5 px-4 py-3 rounded-xl text-sm font-light uppercase tracking-widest text-[#38BDF8] hover:text-[#38BDF8] hover:bg-[#F8F9FA] transition-colors" data-page="PO_Invoice"><i data-lucide="file-check-2" class="w-5 h-5 shrink-0"></i><span class="sidebar-label">PO &amp; Invoices</span></a>
        <a href="../Reports/reports_layout.html" class="sidebar-item flex items-center gap-3.5 px-4 py-3 rounded-xl text-sm font-light uppercase tracking-widest text-[#38BDF8] hover:text-[#38BDF8] hover:bg-[#F8F9FA] transition-colors" data-page="Reports"><i data-lucide="bar-chart-3" class="w-5 h-5 shrink-0"></i><span class="sidebar-label">Reports</span></a>
        <a href="../Activity/activity_layout.html" class="sidebar-item flex items-center gap-3.5 px-4 py-3 rounded-xl text-sm font-light uppercase tracking-widest text-[#38BDF8] hover:text-[#38BDF8] hover:bg-[#F8F9FA] transition-colors" data-page="Activity"><i data-lucide="history" class="w-5 h-5 shrink-0"></i><span class="sidebar-label">Activity Logs</span></a>
      </nav>
    </div>
    <div class="p-4 border-t border-slate-100 space-y-4">
      <button id="collapseBtn" class="w-full sidebar-item flex items-center gap-3.5 px-4 py-3 rounded-xl text-sm font-light uppercase tracking-widest text-[#38BDF8] hover:text-[#38BDF8] hover:bg-[#F8F9FA] transition-colors bg-transparent">
        <i data-lucide="chevrons-left" class="w-5 h-5 shrink-0"></i><span class="sidebar-label">Collapse</span>
      </button>
    </div>
  </aside>

  <!-- ================= MAIN LAYOUT AREA ================= -->
  <main class="flex-1 flex flex-col h-full overflow-hidden">
    
    <!-- ================= HEADER ================= -->
    <header class="bg-white border-b border-vb-card-border h-16 flex items-center justify-between px-8 shrink-0">
      
      <!-- Left side: Hamburger Toggle & Search -->
      <div class="flex items-center gap-4 w-96">
        <button id="menuToggle" class="p-2 text-slate-600 hover:bg-[#F8F9FA] rounded-lg lg:hidden transition-colors">
          <i data-lucide="menu" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Right side: Notifications & Profile -->
      <div class="flex items-center gap-6">
  <div class="relative">
    <button id="profileDropdownBtn" class="flex items-center gap-3 hover:bg-[#F8F9FA] p-2 rounded-xl transition-colors outline-none cursor-pointer">
      <div class="w-8 h-8 rounded-full bg-blue-50 flex items-center justify-center border border-blue-100 text-blue-600 transition-colors shrink-0 overflow-hidden">
        <i data-lucide="user" class="w-4 h-4"></i>
      </div>
      <div class="flex flex-col text-left hidden sm:flex">
        <span class="text-[11px] font-light uppercase tracking-widest leading-tight text-[#38BDF8]">Guest</span>
      </div>
      <i data-lucide="chevron-down" class="w-3 h-3 text-[#38BDF8]"></i>
    </button>
    
    <div id="profileDropdownMenu" class="absolute right-0 mt-2 w-48 bg-white rounded-xl shadow-lg border border-slate-100 hidden z-50 overflow-hidden">
      <div class="py-1">
        <button id="btnLogout" class="w-full text-left px-4 py-2.5 text-sm text-red-600 hover:bg-red-50 flex items-center gap-2 transition-colors font-light uppercase tracking-widest">
          <i data-lucide="log-out" class="w-4 h-4"></i> Logout
        </button>
      </div>
    </div>
  </div>
</div>
    </header>

    <!-- ================= SCROLLABLE CONTENT AREA ================= -->
    <div class="flex-1 overflow-y-auto p-5 space-y-4">
      
      <!-- Vendors Header -->
      <div class="flex flex-col md:flex-row md:items-end justify-between gap-4">
        <div class="text-left space-y-1">
          <h1 class="text-xl font-light uppercase tracking-widest text-[#38BDF8] tracking-tight">Vendors</h1>
          <p class="text-[13px] text-[#38BDF8] font-medium">Manage supplier profiles and registrations</p>
        </div>
        <button id="addVendorBtn" class="bg-[#4ADE80] hover:bg-[#22c55e] text-white rounded-lg py-2.5 px-4 flex items-center justify-center gap-2 font-light uppercase tracking-widest text-xs shadow-sm transition-colors">
          <i data-lucide="plus" class="w-4 h-4"></i>
          <span>Add Vendor</span>
        </button>
      </div>

      <!-- Large Search Bar -->
      <div class="relative w-full">
        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
          <i data-lucide="search" class="w-4.5 h-4.5 text-[#38BDF8]"></i>
        </div>
        <input type="text" id="vendorSearchInput" placeholder="Search by name, gst number, category..." class="w-full bg-[#F8F9FA] hover:bg-[#F8F9FA]/50 focus:bg-white border border-slate-200 focus:border-vb-blue rounded-xl pl-10 pr-4 py-3 text-sm text-slate-700 outline-none transition-all placeholder:text-[#38BDF8]">
      </div>

      <!-- Filter Pills -->
      <div class="flex items-center gap-2 overflow-x-auto pb-1">
        <button class="px-3.5 py-1.5 rounded-lg bg-[#4ADE80] text-white font-light uppercase tracking-widest text-[10px] shadow-sm transition-colors whitespace-nowrap" id="chipAll">All</button>
        <button class="px-3.5 py-1.5 rounded-lg bg-white text-slate-600 hover:bg-[#F8F9FA] border border-slate-200 font-light uppercase tracking-widest text-[10px] shadow-sm transition-colors whitespace-nowrap" id="chipActive">Active</button>
        <button class="px-3.5 py-1.5 rounded-lg bg-white text-slate-600 hover:bg-[#F8F9FA] border border-slate-200 font-light uppercase tracking-widest text-[10px] shadow-sm transition-colors whitespace-nowrap" id="chipPending">Pending</button>
        <button class="px-3.5 py-1.5 rounded-lg bg-white text-slate-600 hover:bg-[#F8F9FA] border border-slate-200 font-light uppercase tracking-widest text-[10px] shadow-sm transition-colors whitespace-nowrap" id="chipBlocked">Blocked</button>
      </div>

      <!-- Vendors Table -->
      <div class="bg-white rounded-xl border border-vb-card-border shadow-sm">
        <div class="overflow-x-auto w-full">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-[#F8F9FA]/70 text-[#38BDF8] font-light uppercase tracking-widest text-[11px] uppercase tracking-wider border-b border-slate-100 select-none">
                <th class="py-3 px-4">Vendor Name</th>
                <th class="py-3 px-4">Category</th>
                <th class="py-3 px-4">GST No.</th>
                <th class="py-3 px-4">Contact No.</th>
                <th class="py-3 px-4">Status</th>
                <th class="py-3 px-4 text-center w-24">Action</th>
              </tr>
            </thead>
            <tbody class="text-sm text-slate-700 divide-y divide-slate-100/50">
              <tr>
                <td colspan="6" class="py-8 text-center text-sm font-medium text-[#38BDF8]">
                  <div class="flex items-center justify-center gap-2">
                    <i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i>
                    <span>Loading vendors...</span>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>

  <!-- Add Vendor Modal Overlay -->
  <div id="addVendorModal" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-4">
    <!-- Backdrop -->
    <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" id="modalBackdrop"></div>
    <!-- Modal Content -->
    <div class="relative bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden flex flex-col max-h-[90vh]">
      <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between shrink-0">
        <h2 class="text-lg font-light uppercase tracking-widest text-[#38BDF8]">Add New Vendor</h2>
        <button id="closeModalBtn" class="text-[#38BDF8] hover:text-slate-600 transition-colors">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div class="p-6 overflow-y-auto grow">
        <form id="addVendorForm" class="space-y-4">
          <div>
            <label class="block text-xs font-light uppercase tracking-widest text-slate-600 uppercase tracking-wider mb-1.5">Vendor Name</label>
            <input type="text" id="vName" required="" class="w-full bg-[#F8F9FA] border border-slate-200 focus:bg-white focus:border-vb-blue rounded-lg px-3 py-2.5 text-sm text-[#38BDF8] outline-none transition-all">
          </div>
          
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-light uppercase tracking-widest text-slate-600 uppercase tracking-wider mb-1.5">Category</label>
              <select id="vCategory" required="" class="w-full bg-[#F8F9FA] border border-slate-200 focus:bg-white focus:border-vb-blue rounded-lg px-3 py-2.5 text-sm text-[#38BDF8] outline-none transition-all cursor-pointer">
                <option value="">Select...</option>
                <option value="Construction">Construction</option>
                <option value="Furniture">Furniture</option>
                <option value="Other">Other (Please specify)</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-light uppercase tracking-widest text-slate-600 uppercase tracking-wider mb-1.5">GST No.</label>
              <input type="text" id="vGst" required="" class="w-full bg-[#F8F9FA] border border-slate-200 focus:bg-white focus:border-vb-blue rounded-lg px-3 py-2.5 text-sm text-[#38BDF8] outline-none transition-all font-mono">
            </div>
          </div>

          <div id="vOtherCategoryDiv" class="hidden">
            <label class="block text-xs font-light uppercase tracking-widest text-slate-600 uppercase tracking-wider mb-1.5">Specify Category</label>
            <input type="text" id="vOtherCategory" class="w-full bg-[#F8F9FA] border border-slate-200 focus:bg-white focus:border-vb-blue rounded-lg px-3 py-2.5 text-sm text-[#38BDF8] outline-none transition-all">
          </div>

          <div>
            <label class="block text-xs font-light uppercase tracking-widest text-slate-600 uppercase tracking-wider mb-1.5">Email / Contact</label>
            <input type="text" id="vContact" required="" class="w-full bg-[#F8F9FA] border border-slate-200 focus:bg-white focus:border-vb-blue rounded-lg px-3 py-2.5 text-sm text-[#38BDF8] outline-none transition-all">
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-light uppercase tracking-widest text-slate-600 uppercase tracking-wider mb-1.5">Status</label>
              <select id="vStatus" required="" class="w-full bg-[#F8F9FA] border border-slate-200 focus:bg-white focus:border-vb-blue rounded-lg px-3 py-2.5 text-sm text-[#38BDF8] outline-none transition-all cursor-pointer">
                <option value="Active">Active</option>
                <option value="Blocked">Blocked</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-light uppercase tracking-widest text-slate-600 uppercase tracking-wider mb-1.5">Relationship</label>
              <select id="vRelationship" required="" class="w-full bg-[#F8F9FA] border border-slate-200 focus:bg-white focus:border-vb-blue rounded-lg px-3 py-2.5 text-sm text-[#38BDF8] outline-none transition-all cursor-pointer">
                <option value="Engaged">Engaged</option>
                <option value="Moderate">Moderate</option>
                <option value="AVG">AVG</option>
              </select>
            </div>
          </div>

          <div>
            <label class="block text-xs font-light uppercase tracking-widest text-slate-600 uppercase tracking-wider mb-1.5">Address (Optional)</label>
            <textarea id="vAddress" rows="2" class="w-full bg-[#F8F9FA] border border-slate-200 focus:bg-white focus:border-vb-blue rounded-lg px-3 py-2.5 text-sm text-[#38BDF8] outline-none transition-all resize-none"></textarea>
          </div>

        </form>
      </div>
      <div class="px-6 py-4 border-t border-slate-100 flex items-center justify-end gap-3 bg-[#F8F9FA] shrink-0">
        <button id="cancelVendorBtn" type="button" class="px-4 py-2 text-sm font-light uppercase tracking-widest text-slate-600 hover:text-[#38BDF8] hover:bg-slate-200/50 rounded-lg transition-colors">Cancel</button>
        <button id="saveVendorBtn" type="button" class="px-4 py-2 text-sm font-light uppercase tracking-widest text-white bg-[#4ADE80] hover:bg-[#22c55e] rounded-lg shadow-sm transition-colors">Save Vendor</button>
      </div>
    </div>
  </div>

  <!-- Load the page scripts -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="../supabase_client.js"></script>
  <script src="./vendors_logic.js"></script>
  <script>
    // Initialize Lucide icons
    lucide.createIcons();
  </script>

  



  


  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const pBtn = document.getElementById('profileDropdownBtn');
      const pMenu = document.getElementById('profileDropdownMenu');
      const bLogout = document.getElementById('btnLogout');
      
      if(pBtn && pMenu) {
        // Remove existing listeners if any by cloning
        const newBtn = pBtn.cloneNode(true);
        pBtn.parentNode.replaceChild(newBtn, pBtn);
        
        newBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          pMenu.classList.toggle('hidden');
        });
        
        document.addEventListener('click', (e) => {
          if(!pMenu.contains(e.target) && !newBtn.contains(e.target)) {
            pMenu.classList.add('hidden');
          }
        });
      }
      
      if(bLogout) {
        const newLogout = bLogout.cloneNode(true);
        bLogout.parentNode.replaceChild(newLogout, bLogout);
        
        newLogout.addEventListener('click', async () => {
          if(window.supabaseClient && window.supabaseClient.auth) {
            await window.supabaseClient.auth.signOut();
          }
          window.location.href = '../Login/login_layout.html';
        });
      }
    });
  </script>

</body></html>
